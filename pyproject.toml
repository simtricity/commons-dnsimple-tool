[project]
name = "dnsimple-cli"
version = "0.2.0"
description = "CLI tool to sync and manage DNSimple domains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Simtricity Limited" }]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "tinydb>=4.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/simtricity/commons-dnsimple-tool"
Changelog = "https://github.com/simtricity/commons-dnsimple-tool/blob/main/CHANGELOG.md"

[project.scripts]
dnsimple = "dnsimple_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
