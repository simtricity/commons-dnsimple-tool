name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      # The private name denylist is not in the repo, so the name check skips here; it runs
      # on maintainers' machines against ../_boundary/denylist.txt.
      - run: uv run pytest -q -rs
      - run: uvx pyright
